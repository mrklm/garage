name: Build release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version sans le v initial"
        required: true
        default: "4.4.19-legacy"
  push:
    tags:
      - "v*-legacy"

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-macos:
    name: macOS legacy x86_64
    runs-on: macos-13
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Resolve version
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=${{ github.event.inputs.version }}" >> "$GITHUB_ENV"
          fi

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: Build DMG
        run: ./build-macos.sh -v "$VERSION"

      - uses: actions/upload-artifact@v4
        with:
          name: Garage-legacy-macOS-x86_64
          path: |
            releases/Garage-${{ env.VERSION }}-macOS-x86_64.dmg
            releases/Garage-${{ env.VERSION }}-macOS-x86_64.dmg.sha

  publish-release:
    name: Publish GitHub release
    needs:
      - build-macos
    if: github.ref_type == 'tag'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Package artifacts by OS
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p release-packages

          (
            cd release-artifacts/Garage-legacy-macOS-x86_64
            zip -r "../../release-packages/Garage-${VERSION}-legacy-macOS-x86_64-assets.zip" .
          )

      - name: Attach artifacts to release
        uses: softprops/action-gh-release@v2
        with:
          name: Garage ${{ github.ref_name }}
          files: release-packages/*
